[metadata]
name = mobi-plugin
version = 0.1.0
author = TonNom
author_email = ton.email@example.com
description = Plugin Napari pour la lecture des fichiers HDF5/NXS
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/TonProfil/TonDepot
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    napari
    h5py
    numpy
    scipy
    PyQt5

[options.entry_points]
napari.manifest =
    mobi-plugin = mobi_plugin:napari.yaml
